name: FRONTIER Cycles CPU smoke test
on:
  push:
    paths:
      - '.github/workflows/frontier-cycles-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cycles:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Select Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install official Blender Python wheel
        timeout-minutes: 15
        run: |
          python -m venv "$RUNNER_TEMP/blender-venv"
          source "$RUNNER_TEMP/blender-venv/bin/activate"
          python -m pip install --index-url https://pypi.org/simple --only-binary=:all: --timeout 60 --retries 2 bpy==4.5.16
          python -c "import bpy; print('BLENDER_VERSION', bpy.app.version_string); print('CYCLES_AVAILABLE', bpy.app.build_options.cycles); assert bpy.app.build_options.cycles"
          echo "$RUNNER_TEMP/blender-venv/bin" >> "$GITHUB_PATH"
      - name: Render original synthetic robot with Cycles
        run: |
          mkdir -p result
          cat > smoke.py <<'PY'
          import bpy, math, time, json, os, hashlib, struct
          from mathutils import Vector
          bpy.ops.object.select_all(action='SELECT')
          bpy.ops.object.delete(use_global=False)
          def mat(name,color,metal,rough):
              m=bpy.data.materials.new(name); m.use_nodes=True
              p=m.node_tree.nodes.get('Principled BSDF')
              p.inputs['Base Color'].default_value=(*color,1)
              p.inputs['Metallic'].default_value=metal
              p.inputs['Roughness'].default_value=rough
              return m
          teal=mat('Enamel teal',(.035,.32,.30),.65,.28)
          red=mat('Enamel red',(.65,.035,.024),.5,.25)
          steel=mat('Tin',(.55,.60,.65),.94,.23)
          brass=mat('Brass',(.55,.28,.045),.85,.22)
          black=mat('Dark rubber',(.018,.023,.029),.0,.55)
          ivory=mat('Ivory',(.8,.72,.48),.15,.33)
          floor=mat('Stage',(.11,.065,.045),.0,.48)
          def box(name,loc,dim,m,bevel=.06):
              bpy.ops.mesh.primitive_cube_add(size=1,location=loc)
              o=bpy.context.object;o.name=name;o.dimensions=dim
              bpy.ops.object.transform_apply(location=False,rotation=False,scale=True)
              o.data.materials.append(m)
              b=o.modifiers.new('Rolled edges','BEVEL');b.width=bevel;b.segments=3
              o.modifiers.new('Normals','WEIGHTED_NORMAL')
              return o
          def ball(loc,r,m):
              bpy.ops.mesh.primitive_uv_sphere_add(segments=24,ring_count=12,radius=r,location=loc)
              o=bpy.context.object;o.data.materials.append(m)
              for p in o.data.polygons:p.use_smooth=True
              return o
          def rod(a,b,r,m):
              a,b=Vector(a),Vector(b);d=b-a
              bpy.ops.mesh.primitive_cylinder_add(vertices=32,radius=r,depth=d.length,location=(a+b)/2)
              o=bpy.context.object;o.rotation_euler=d.to_track_quat('Z','Y').to_euler();o.data.materials.append(m)
              return o
          box('Body',(0,0,1.45),(1.05,.65,1.15),teal,.12)
          box('Head',(0,0,2.35),(1.03,.78,.75),red,.12)
          box('Face',(0,-.397,2.35),(.82,.06,.52),ivory,.05)
          box('Chest plate',(0,-.337,1.49),(.70,.05,.64),steel,.05)
          for s in [-1,1]:
              ball((s*.24,-.45,2.43),.11,black)
              ball((s*.24,-.53,2.47),.035,ivory)
              rod((s*.30,0,1.05),(s*.36,0,.33),.14,steel)
              box('Boot',(s*.36,-.13,.18),(.43,.58,.28),red,.07)
              ball((s*.62,0,1.78),.17,brass)
              rod((s*.62,0,1.78),(s*.92,-.09,1.23+s*.16),.12,steel)
              ball((s*.92,-.09,1.23+s*.16),.15,red)
              for z in [1.25,1.72]:ball((s*.43,-.33,z),.035,brass)
          for i in range(5):
              box('Mouth grille',((i-2)*.07,-.438,2.19),(.04,.035,.055),black,.008)
          rod((0,.02,2.7),(0,.02,3.0),.035,steel);ball((0,.02,3),.10,brass)
          rod((0,.33,1.54),(0,.85,1.54),.08,brass)
          for s in [-1,1]:
              box('Wind key',(s*.21,.85,1.54),(.35,.10,.24),brass,.06)
          box('Matte stage',(0,0,-.075),(200,200,.1),floor,.01)
          def aim(o,p):o.rotation_euler=(Vector(p)-o.location).to_track_quat('-Z','Y').to_euler()
          def area(name,loc,power,color,size):
              d=bpy.data.lights.new(name,'AREA');d.energy=power;d.color=color;d.shape='DISK';d.size=size
              o=bpy.data.objects.new(name,d);bpy.context.collection.objects.link(o);o.location=loc;aim(o,(0,0,1.5))
          area('Warm key',(-3,-4,6),650,(1,.73,.45),3.2)
          area('Cool fill',(4,-2,3),350,(.46,.70,1),2.5)
          area('Rim',(1,4,5),1000,(1,.55,.24),2.0)
          bpy.ops.object.camera_add(location=(5,-8,4.1));cam=bpy.context.object;aim(cam,(0,0,1.55));cam.data.lens=60
          cam.data.dof.use_dof=True;cam.data.dof.focus_distance=(cam.location-Vector((0,0,1.55))).length;cam.data.dof.aperture_fstop=5.6
          sc=bpy.context.scene;sc.camera=cam;sc.world.color=(.12,.12,.12)
          sc.render.engine='CYCLES';sc.render.threads_mode='FIXED';sc.render.threads=4;sc.cycles.device='CPU';sc.cycles.samples=32;sc.cycles.use_denoising=True
          sc.render.resolution_x=800;sc.render.resolution_y=600;sc.render.resolution_percentage=100
          sc.render.image_settings.file_format='PNG';sc.render.filepath=os.path.abspath('result/cycles.png')
          t=time.monotonic();bpy.ops.render.render(write_still=True)
          assert os.path.getsize(sc.render.filepath)>1000
          proof=dict(version=bpy.app.version_string,engine=sc.render.engine,device=sc.cycles.device,samples=sc.cycles.samples,width=800,height=600,seconds=round(time.monotonic()-t,3),png_bytes=os.path.getsize(sc.render.filepath))
          with open(sc.render.filepath,'rb') as f: png=f.read()
          assert png[:8]==b'\x89PNG\r\n\x1a\n' and struct.unpack('>II',png[16:24])==(800,600)
          proof['sha256']=hashlib.sha256(png).hexdigest()
          print('CYCLES_PROOF',json.dumps(proof),flush=True)
          with open('result/proof.json','w') as f:json.dump(proof,f,indent=2)
          bpy.ops.wm.save_as_mainfile(filepath=os.path.abspath('result/robot.blend'))
          PY
          python -u smoke.py
          test -s result/cycles.png
          cat result/proof.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload render and proof
        uses: actions/upload-artifact@v4
        with:
          name: frontier-cycles-proof
          path: result/
          retention-days: 1
          if-no-files-found: error
